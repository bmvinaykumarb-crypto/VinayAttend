<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Faculty Login - Smart Lab Attendance</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">
  <div class="login-card">
    <h2>🔐 Faculty Sign In</h2>
    <p style="margin: 0 0 24px 0; color: var(--text-secondary); line-height: 1.5; font-size: 0.9rem;">
      Log in to manage student registries, view historical attendance, and export session logs.
    </p>
    <form action="faculty_redirect.html" method="get">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="professor@college.edu" required />
      </div>
      <div class="form-group">
        <label>Security Password</label>
        <input type="password" name="password" placeholder="••••••••" required />
      </div>
      <div class="form-actions">
        <button class="btn" type="submit">Sign In</button>
        <a href="frontend.html" class="link-muted">← Back to Dashboard</a>
      </div>
    </form>
  </div>
</body>
</html>
